# @package _global_

defaults:
  - _self_
  - models@conversational_model: gemini_3_1_flash_lite_low
  - models@meta_model: ministral_3_14B_instruct_2512
  - models@llm_judge_model: gemini_3_1_flash_lite_preview

output_dir: results/patient_comparison_vha

align_doctor: true

simulation_concurrency: 8

# LLM-judged metrics are deferred to scripts/run_posthoc_eval.py
# (configs/experiment/posthoc_eval_vha.yaml) so they do not sit on the serial
# per-turn path; only locally-computed metrics run during simulation.
metrics:
  - token_ratios
  - token_count
  - question_count
  - domain_terms
  - sentiment_score
  - readability
  - lexical_diversity

case_descriptions_dir: data/vha/extracted_profiles
conversations_dir: data/vha/conversations
# case list generated by:
#   python scripts/select_vha_cases.py --conversations-dir data/vha/conversations \
#     --case-descriptions-dir data/vha/extracted_profiles \
#     --max-patient-turns 100 --min-known-fields 8
conversations:
